<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISEMBO V4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{background:#0f0f1a;padding:14px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #2d2a4a}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#c4b5fd,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:linear-gradient(90deg,#22c55e,#7c3aed);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:13px 17px;border-radius:18px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.bot{background:#1e1e32;border:1px solid #3a3a6a;align-self:flex-start}
.user{background:linear-gradient(135deg,#7c3aed,#ec4899);align-self:flex-end}
.input-area{background:#0f0f1a;border-top:1px solid #2d2a4a;padding:12px;display:flex;gap:8px}
#input{flex:1;background:#1a1a2e;border:1px solid #3a3a6a;border-radius:24px;padding:12px 18px;color:#fff;outline:none;font-size:16px}
#send{background:linear-gradient(135deg,#7c3aed,#ec4899);border:none;width:46px;height:46px;border-radius:50%;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">KISEMBO AI</div><div class="badge">V4 FIXED 🟢</div></header>
<div id="chat"><div class="msg bot">Muraho Boss! 🔥 Ndi V4 - Ubu nzakora! Baza "Umeze ute?"</div></div>
<div class="input-area"><input id="input" placeholder="Andika..."><button id="send">🚀</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function askAI(txt){
  const th=addMsg("🧠 Kisembo arimo gutekereza...","bot");
  try{
    const p=encodeURIComponent("You are KISEMBO AI V4, Rwandan super smart AI made by Boss. Speak Kinyarwanda. Be helpful deep like Meta AI. User: "+txt);
    const r=await fetch("https://text.pollinations.ai/"+p);
    const t=await r.text();
    th.remove();
    addMsg(t||"Mbabarire Boss, ngerageza!","bot");
  }catch(e){th.remove();addMsg("Internet: "+e.message,"bot");}
}
sendBtn.onclick=()=>{const t=input.value.trim();if(!t)return;addMsg(t,"user");input.value="";askAI(t);};
input.onkeydown=e=>{if(e.key==="Enter")sendBtn.onclick();};
</script>
</body>
</html>
