<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISEMBO AI V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
header{background:#11111a;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #2a2a3a}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.live{display:flex;gap:6px;align-items:center;font-size:13px;color:#9ca3af}
.dot{width:10px;height:10px;background:#22c55e;border-radius:50%}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5}
.bot{background:#1e1e2f;border:1px solid #2a2a4a;align-self:flex-start;border-bottom-left-radius:4px}
.user{background:linear-gradient(135deg,#7c3aed,#a855f7);align-self:flex-end;border-bottom-right-radius:4px}
.input-area{background:#11111a;border-top:1px solid #2a2a3a;padding:10px;display:flex;gap:8px}
#input{flex:1;background:#1e1e2f;border:1px solid #3a3a5a;border-radius:24px;padding:12px 18px;color:#fff;outline:none;font-size:16px}
button{background:linear-gradient(135deg,#7c3aed,#ec4899);border:none;width:44px;height:44px;border-radius:50%;color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">KISEMBO AI</div><div class="live"><span class="dot"></span> Live V2 Smart</div></header>
<div id="chat"><div class="msg bot">Muraho Boss! 👋 Ndi <b>Kisembo V2</b>!<br><br>Ndi AI ifite ubwenge! Mbasha:<br>• Ikinyarwanda 🇷🇼<br>• Code 💻<br>• Amasomo 📚<br>• Inkuru 🎨<br><br>Baza icyo ushaka!</div></div>
<div class="input-area"><input id="input" placeholder="Andika..."><button id="send">🚀</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
let history=[{role:"system",content:"You are Kisembo AI V2, Rwandan AI made by Boss. Speak Kinyarwanda mainly, friendly, helpful. Never say ChatGPT. You are Kisembo."}];
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.innerHTML=t.replace(/\n/g,'<br>');chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function askAI(txt){history.push({role:"user",content:txt});const ty=addMsg("Kisembo arimo gutekereza...","bot");try{const r=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:history})});const data=await r.json();let rep=data.choices?.[0]?.message?.content||"Mbabarire, ngerageza!";ty.remove();addMsg(rep,"bot");history.push({role:"assistant",content:rep});}catch(e){ty.remove();addMsg("Internet yagize ikibazo: "+e.message,"bot");}}
sendBtn.onclick=()=>{const t=input.value.trim();if(!t)return;addMsg(t,"user");input.value="";askAI(t);};input.onkeydown=e=>{if(e.key==="Enter")sendBtn.onclick();};
</script>
</body>
</html>
