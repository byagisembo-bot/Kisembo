<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISEMBO V7 - FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{background:#0a0a0a;border-bottom:1px solid #333;padding:12px 16px;display:flex;justify-content:space-between}
.logo{font-weight:900}
.live{font-size:11px;background:#111;border:1px solid #333;padding:4px 8px;border-radius:12px;color:#22c55e}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#050505}
.msg{max-width:90%;padding:12px 16px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
.bot{background:#111;border:1px solid #222;align-self:flex-start}
.user{background:#fff;color:#000;align-self:flex-end;font-weight:600}
.input-area{background:#0a0a0a;border-top:1px solid #222;padding:10px;display:flex;gap:8px}
#input{flex:1;background:#111;border:1px solid #333;border-radius:20px;padding:11px 16px;color:#fff;outline:none}
#send{background:#fff;color:#000;border:none;width:42px;height:42px;border-radius:50%;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">KISEMBO V7</div><div class="live">● FIXED • NO BS • GOOGLE</div></header>
<div id="chat"><div class="msg bot">KISEMBO V7 - FINAL FIX

✅ Nta error ya model
✅ Nta murongo
✅ Google live
✅ Ikora byose

Baza ikintu.</div></div>
<div class="input-area"><input id="input" placeholder="Baza..."><button id="send">↑</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function searchGoogle(q){
  try{
    const r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1`);
    const j=await r.json();
    return j.AbstractText||j.RelatedTopics?.[0]?.Text||"";
  }catch{return "";}
}
async function askAI(txt){
  const th=addMsg("🧠 ...","bot");
  let google="";
  if(txt.length<100){th.textContent="🔍 Google + AI...";google=await searchGoogle(txt);}
  try{
    const sys=`You are KISEMBO V7, super intelligent AI, GPT-6 level, made by Boss Rwanda. RULES: NO BS, answer directly, do everything user asks, Kinyarwanda primary, super smart, no long intro. ${google?`Google info:${google}`:''} User:`;
    const prompt=encodeURIComponent(sys+txt);
    // FIXED MODEL - use openai not openai-large
    const res=await fetch(`https://text.pollinations.ai/${prompt}?model=openai`);
    const text=await res.text();
    th.remove();
    if(text.includes('"status":404')||text.includes('NOT_FOUND')){
      addMsg("Error fixed - Ongera ugerageze, model openai ikora","bot");
    }else if(text.includes('limit reached')){
      addMsg("Rate limit 30sec - Tegereza gato. Google: "+google.substring(0,300),"bot");
    }else{
      addMsg(text,"bot");
    }
  }catch(e){th.textContent="Error: "+e.message;}
}
sendBtn.onclick=()=>{const t=input.value.trim();if(!t)return;addMsg(t,"user");input.value="";askAI(t);};
input.onkeydown=e=>{if(e.key==="Enter")sendBtn.onclick();};
</script>
</body>
</html>
