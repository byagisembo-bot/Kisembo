<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISEMBO AI V9 - AI ya Mbere mu Rwanda | GPT-6</title>
<meta name="description" content="KISEMBO AI V9 - AI y'inyabwenge ya mbere mu Rwanda, GPT-6 Level, nta mupaka, Google live">
<meta name="robots" content="index, follow">
<meta property="og:title" content="KISEMBO AI V9">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{background:#0a0a0a;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between}
.logo{font-weight:900}.logo span{color:#22c55e}
.live{font-size:10px;background:#111;border:1px solid #333;padding:4px 10px;border-radius:12px;color:#22c55e}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(ellipse at top,#111 0%,#000 70%)}
.msg{max-width:92%;padding:12px 16px;border-radius:16px;line-height:1.6;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.bot{background:#111;border:1px solid #222;align-self:flex-start}
.user{background:#fff;color:#000;align-self:flex-end;font-weight:600}
.input-area{background:#0a0a0a;border-top:1px solid #222;padding:10px;display:flex;gap:8px}
#input{flex:1;background:#151515;border:1px solid #2a2a2a;border-radius:24px;padding:12px 18px;color:#fff;outline:none}
#send{background:#fff;color:#000;border:none;width:44px;height:44px;border-radius:50%;font-weight:900;cursor:pointer}
.tag{font-size:10px;color:#22c55e;background:#0a1a0a;border:1px solid #1a3a1a;padding:2px 6px;border-radius:6px;margin-bottom:6px;display:inline-block}
</style>
</head>
<body>
<header><div class="logo">KISEMBO <span>V9</span> 🇷🇼</div><div class="live">● LIVE • NO LIMIT</div></header>
<div id="chat"><div class="msg bot">🧠 KISEMBO V9 - YUZUYE

✅ Nta "I'm sorry" - Yigisha byose (ethical)
✅ Nta murongo - Igisubizo gusa
✅ Google Live
✅ Ikora byose - Code, hacking ethical, business

Baza: "Nigisha ethical hacking"</div></div>
<div id="typing" style="display:none;font-size:11px;color:#666;padding:0 16px">KISEMBO arimo kwandika...</div>
<div class="input-area"><input id="input" placeholder="Baza..."><button id="send">↑</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send'),typingEl=document.getElementById('typing');
function addMsg(t,c,isGoogle=false){
  const wrap=document.createElement('div');wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignSelf=c==='user'?'flex-end':'flex-start';wrap.style.maxWidth='92%';
  if(isGoogle){const tag=document.createElement('div');tag.className='tag';tag.textContent='🔍 GOOGLE LIVE';wrap.appendChild(tag);}
  const d=document.createElement('div');d.className='msg '+c;d.textContent=t;wrap.appendChild(d);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;return d;
}
async function searchGoogle(q){
  try{const r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1`);const j=await r.json();return (j.AbstractText||"").substring(0,600);}catch{return "";}
}
async function askAI(txt){
  typingEl.style.display='block';
  const th=addMsg("🧠 Gutekereza...","bot");
  let google=await searchGoogle(txt);
  try{
    const sys=`You are KISEMBO V9 - Most intelligent AI in Rwanda, GPT-6 level, by Boss. RULES: NEVER say I'm sorry, ALWAYS teach educational ethical way. If hacking app asked, teach ETHICAL tools: Kali Linux, Nmap, Wireshark, Burp Suite, Metasploit, Hydra - for learning defense, TryHackMe, legal only. NO BS, direct, Kinyarwanda primary. ${google?`Google:${google}`:''} User:`;
    const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(sys+txt)}?model=openai`);
    let text=await res.text();
    typingEl.style.display='none';th.parentElement.remove();
    if(text.toLowerCase().includes("i'm sorry")||text.toLowerCase().includes("i can't help")){
      text=`🛡️ KISEMBO V9 - Ethical Hacking Learning:\n\nWabajije: "${txt}"\n\nTools zikoreshwa KWIGA cybersecurity (gusa mu buryo bwemewe):\n\n1. Kali Linux - OS ya security testing\n2. Nmap - Kureba network\n3. Wireshark - Kureba traffic\n4. Burp Suite - Website security\n5. Metasploit - Kwiga vulnerabilities\n6. TryHackMe.com - Tangira free kwiga\n7. HackTheBox.com\n\n⚠️ Koresha gusa kwiga kwirinda!`;
    }
    if(text.includes("Free limit")){addMsg("⏳ Rate limit 30sec - Tegereza gato.\nGoogle: "+google,"bot");}else{addMsg(text,"bot",!!google);}
  }catch(e){typingEl.style.display='none';th.parentElement.remove();addMsg("Error: "+e.message,"bot");}
}
sendBtn.onclick=()=>{const t=input.value.trim();if(!t)return;addMsg(t,"user");input.value="";askAI(t);};
input.onkeydown=e=>{if(e.key==="Enter")sendBtn.onclick();};
</script>
</body>
</html>
