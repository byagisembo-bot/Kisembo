<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISEMBO V6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{background:#0a0a0a;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between}
.logo{font-weight:900;font-size:20px}
.live{font-size:11px;background:#111;border:1px solid #333;padding:4px 8px;border-radius:12px;color:#22c55e}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#050505}
.msg{max-width:90%;padding:12px 16px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.bot{background:#111;border:1px solid #222;align-self:flex-start}
.user{background:#fff;color:#000;align-self:flex-end;font-weight:500}
.input-area{background:#0a0a0a;border-top:1px solid #222;padding:10px;display:flex;gap:8px}
#input{flex:1;background:#111;border:1px solid #333;border-radius:20px;padding:11px 16px;color:#fff;outline:none}
#send{background:#fff;color:#000;border:none;width:42px;height:42px;border-radius:50%;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">KISEMBO V6</div><div class="live">● GOOGLE LIVE • NO BS</div></header>
<div id="chat"><div class="msg bot">KISEMBO V6 - NO MURONGO.
• Nsubiza gusa
• Nkoresha Google iyo bikenewe
• Nkora icyo unsabye cyose
Baza.</div></div>
<div class="input-area"><input id="input" placeholder="Baza..."><button id="send">↑</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function needsGoogle(q){const k=['nde','ni ryari','uyu munsi','amakuru','igiciro','ninde','news','price','latest','today','2026','weather'];return k.some(x=>q.toLowerCase().includes(x));}
async function searchGoogle(query){
  try{
    const ddg=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`);
    const data=await ddg.json();
    let r=data.AbstractText||"";
    if(data.RelatedTopics) r+= "\\n"+data.RelatedTopics.slice(0,2).map(x=>x.Text||"").join("\\n");
    return r||"No results";
  }catch(e){return "";}
}
async function askAI(txt){
  const th=addMsg("...","bot");
  let g="";let u=false;
  if(needsGoogle(txt)){th.textContent="🔍 Google search...";g=await searchGoogle(txt);u=true;th.textContent="🧠 Thinking...";}
  try{
    let sys=`You are KISEMBO V6 - GPT-6 level. RULES: NO BS, no fluff, answer DIRECTLY, code if asked code, do everything user asks, Kinyarwanda primary, super smart like Meta AI, no "Boss" intro. ${u?`GOOGLE:${g}`:''} User:`;
    const p=encodeURIComponent(sys+txt);
    const r=await fetch("https://text.pollinations.ai/"+p+"?model=openai-large");
    const t=await r.text();
    th.remove();
    if(t.includes("limit")) addMsg("Rate limit 30sec - Ongera ugerageze. Google: "+g,"bot");
    else addMsg((u?"[🔍 Google]\\n\\n":"")+t,"bot");
  }catch(e){th.textContent="Error: "+e.message;}
}
sendBtn.onclick=()=>{const t=input.value.trim();if(!t)return;addMsg(t,"user");input.value="";askAI(t);};
input.onkeydown=e=>{if(e.key==="Enter")sendBtn.onclick();};
</script>
</body>
</html>
