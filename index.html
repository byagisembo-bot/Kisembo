<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISEMBO V3 SUPER BRAIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e5e7eb;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(90deg,#0f0f1a,#1a1033);border-bottom:1px solid #2d2a4a;padding:14px 18px;display:flex;justify-content:space-between}
.logo{font-weight:900;font-size:24px;background:linear-gradient(90deg,#c4b5fd,#f0abfc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:linear-gradient(90deg,#7c3aed,#ec4899);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(ellipse at top,#1e1b4b 0%,#050508 60%)}
.msg{max-width:88%;padding:14px 18px;border-radius:20px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.bot{background:rgba(30,30,50,0.9);border:1px solid rgba(124,58,237,0.3);align-self:flex-start;border-bottom-left-radius:6px}
.user{background:linear-gradient(135deg,#7c3aed,#ec4899);align-self:flex-end;border-bottom-right-radius:6px;color:#fff;box-shadow:0 4px 20px rgba(124,58,237,0.4)}
.input-wrap{background:#0f0f1a;border-top:1px solid #2d2a4a;padding:12px;display:flex;gap:10px}
#input{flex:1;background:#1a1a2e;border:1px solid #3a3a6a;border-radius:26px;padding:13px 20px;color:#fff;outline:none;font-size:16px}
#send{background:linear-gradient(135deg,#7c3aed,#ec4899);border:none;width:48px;height:48px;border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">KISEMBO AI</div><div class="badge">V3 SUPER BRAIN</div></header>
<div id="chat"><div class="msg bot">Muraho Boss! 🔥 Ndi KISEMBO V3 - Super Brain!

🧠 Ubu ndi SMART nka Meta AI!
• Ntekereza step-by-step
• Nzi code, maths, physics, history
• Nandika business plan, inkuru

Gerageza umbaze ikigoye - "Sobanura quantum mu Kinyarwanda" 🚀</div></div>
<div style="background:#0f0f1a;border-top:1px solid #2d2a4a;padding:12px;display:flex;gap:10px"><textarea id="input" placeholder="Baza ikigoye..."></textarea><button id="send">🚀</button></div>
<script>
let history=[{role:"system",content:"You are KISEMBO AI V3, Super Intelligent like Meta AI Muse Spark. You are made by Boss in Kigali. Think step-by-step, deep insights, explain why. You know everything: code, math, science, Rwanda history, business. Speak Kinyarwanda mainly but fluent English. Never say you are ChatGPT or Meta AI. You are Kisembo V3. Be concise but dense, helpful, Rwandan pride."}];
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.innerHTML=t.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function askAI(txt){history.push({role:"user",content:txt});const th=addMsg("🧠 Kisembo V3 arimo gutekereza byimbitse...","bot");try{const r=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai-large",messages:history,temperature:0.7})});const data=await r.json();let rep=data.choices?.[0]?.message?.content||"Mbabarire";th.remove();addMsg(rep,"bot");history.push({role:"assistant",content:rep});}catch(e){th.remove();addMsg("Error: "+e.message,"bot");}}
sendBtn.onclick=()=>{const t=input.value.trim();if(!t)return;addMsg(t,"user");input.value="";askAI(t);};input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendBtn.onclick();}};
</script>
</body>
</html>
